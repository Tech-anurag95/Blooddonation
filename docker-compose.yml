version: '3.8'
services:
  mongo:
    image: mongo:6
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    ports:
      - '27017:27017'

  server:
    build: ./server
    restart: unless-stopped
    ports:
      - '5000:5000'
    env_file:
      - ./server/.env
    depends_on:
      - mongo

  client:
    build: ./client
    restart: unless-stopped
    ports:
      - '3000:80'

volumes:
  mongodb_data:
