<!DOCTYPE html>
<html>
<head>
    <title>Direct Login Test</title>
    <style>
        body { font-family: Arial; padding: 20px; max-width: 600px; margin: 0 auto; }
        input, button { padding: 10px; margin: 5px 0; width: 100%; }
        button { background: #dc2626; color: white; border: none; cursor: pointer; }
        #result { margin-top: 20px; padding: 10px; background: #f3f4f6; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h1>Direct Login Test (No React)</h1>
    <p>This tests the API directly without React</p>
    
    <input type="email" id="email" value="shivam@gmail.com" placeholder="Email">
    <input type="password" id="password" value="shivam123" placeholder="Password">
    <button onclick="testLogin()">Test Login</button>
    
    <div id="result"></div>

    <script>
        async function testLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const resultDiv = document.getElementById('result');
            
            resultDiv.textContent = 'Testing...';
            
            try {
                const response = await fetch('http://localhost:5000/api/auth/login/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.textContent = '✅ SUCCESS!\n\n' + JSON.stringify(data, null, 2);
                    resultDiv.style.background = '#d1fae5';
                } else {
                    resultDiv.textContent = '❌ FAILED\n\nStatus: ' + response.status + '\n\n' + JSON.stringify(data, null, 2);
                    resultDiv.style.background = '#fee2e2';
                }
            } catch (error) {
                resultDiv.textContent = '❌ ERROR\n\n' + error.message;
                resultDiv.style.background = '#fee2e2';
            }
        }
    </script>
</body>
</html>
